name: UberSense
description: >-
  UberSense was a Boston, Massachusetts sports-technology startup whose mobile
  app provided slow-motion video capture and analysis for coaching athletes,
  from recreational to Olympic and professional levels. Backed by GV (Google
  Ventures), UberSense was acquired by Hudl in September 2014 and its
  technology folded into Hudl's sports video analysis products. The
  ubersense.com website is now defunct (a decommissioned Heroku app) and the
  company publishes no public API surface.
